name: Flutter Mobile CI (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "flutter_student_app/**"

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_student_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_student_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
